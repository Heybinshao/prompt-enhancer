name: prompt-enhancer
version: 1.8.4
requires_hermes: ">=0.21.6"
description: "A button in the Hermes Desktop composer that first repairs dictation typos in the draft, then rewrites it into a structured prompt (task / scope / constraints / output shape), with one more click to restore the original typing. ⌘-click picks the enhancement model for one run or as the default. Two stateless gateway calls (repair → enhance), preserves @file and /command chips, per-session state."
author: Heybinshao
license: MIT
homepage: https://github.com/Heybinshao/prompt-enhancer
tags: [desktop, composer, prompt, llm]
# Desktop-only package: the UI lives in desktop/plugin.js and registers nothing
# on the agent side (no tools, hooks, middleware or env vars).
provides_tools: []
provides_hooks: []
capabilities: []
requires_env: []
python_dependencies: []
